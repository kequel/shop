version: '3.8'

services:
  prestashop:
    image: kequel/be-prestashop-196615:latest
    ports:
      - "19665:443"
    environment:
      - PS_DEV_MODE=0
      - DB_SERVER=admin-mysql_db
      - DB_NAME=BE_196615_prestashop
      - DB_USER=root
      - DB_PASSWORD=student
    volumes:
      - /opt/storage/actina15-20/block-storage/students/projects/students-swarm-services/BE_196615/img:/var/www/html/img
      - /opt/storage/actina15-20/block-storage/students/projects/students-swarm-services/BE_196615/prestashop_dump.sql:/tmp/prestashop_dump.sql
    networks:
      - be_196615_net
      - admin-mysql_default
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      placement:
        constraints:
          - node.hostname == student-swarm01
      restart_policy:
        condition: on-failure

  memcached:
    image: memcached:latest
    networks:
      - be_196615_net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
      restart_policy:
        condition: on-failure

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "19666:8025"
    networks:
      - be_196615_net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

networks:
  be_196615_net:
    driver: overlay
    attachable: true
  admin-mysql_default:
    external: true
